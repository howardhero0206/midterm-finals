<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>115-1 高三上第一次段考 詳解｜Midterm (I)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EBEE; --card:#FDFDFC;
  --ink:#10202F; --ink-2:#56687A; --ink-3:#7C8B99;
  --rule:#C6D0D8; --pen:#17457E; --hl:#FFE773; --miss:#A34234;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  --read:'Literata',Georgia,'Times New Roman',serif;
  --han:'PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  --maxw:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--han);font-size:16px;line-height:1.75}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px;border-radius:2px}

.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:14px 24px 0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.title{font-size:23px;font-weight:600;margin:0;line-height:1.3}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin:4px 0 0;letter-spacing:.04em}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px 0 11px;margin-top:10px;border-top:1px solid var(--rule)}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.04em;border:1px solid var(--rule);background:transparent;color:var(--ink-2);padding:5px 10px;border-radius:999px;cursor:pointer;text-decoration:none;transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--pen);color:var(--pen)}
.chip.solid{margin-left:auto;border-color:var(--ink);color:var(--ink);font-weight:500}
.chip.solid:hover{background:var(--ink);color:var(--card)}

.wrap{max-width:var(--maxw);margin:0 auto;padding:28px 24px 96px;display:grid;gap:36px;grid-template-columns:minmax(0,1fr) 288px}
@media (max-width:1020px){.wrap{grid-template-columns:minmax(0,1fr);gap:44px}}

.sec{margin:0 0 48px;scroll-margin-top:136px}
.sec-head{display:flex;align-items:baseline;gap:12px;padding-bottom:9px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.sec-num{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--ink-3)}
.sec-label{font-size:18px;font-weight:600;margin:0}
.sec-score{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:auto}
.sec-inst{font-size:13.5px;color:var(--ink-2);margin:9px 0 0}

.bank{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:16px 0 0}
@media (max-width:760px){.bank{grid-template-columns:repeat(2,1fr)}}
.bank-i{background:var(--card);padding:8px 10px;font-family:var(--read);font-size:14.5px}
.bank-i span{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-right:5px}
.bank-i.used{background:#F2F5F6;color:var(--ink-3)}

.passage{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--ink);padding:22px 26px;margin:18px 0 0;font-family:var(--read);font-size:16.5px;line-height:1.95;color:#1a2836}
.passage p{margin:0 0 1em}
.passage p:last-child{margin-bottom:0}
.blank{display:inline-block;min-width:70px;text-align:center;border:0;border-bottom:1.5px solid var(--ink);font-family:var(--mono);font-size:13px;color:var(--pen);cursor:pointer;background:none;padding:0 4px;line-height:1.4}
.blank:hover{background:rgba(23,69,126,.07)}
.blank.filled{font-family:var(--read);font-size:16.5px;color:var(--ink);border-bottom-color:transparent;min-width:0}
.blank sup{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-right:2px}
.zhbtn{display:block;margin:0 0 18px;background:var(--card);border:1px solid var(--rule);border-top:0;width:100%;text-align:left;padding:8px 26px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--pen);cursor:pointer}
.zhbtn:hover{color:var(--ink)}
.zhbtn::after{content:' ▾'}
.zhbtn.on::after{content:' ▴'}
.zhbox{display:none;background:#F7F9FA;border:1px solid var(--rule);border-top:0;padding:18px 26px;margin:0 0 18px;font-size:15px;line-height:1.95;color:#22323F}
.zhbox.on{display:block}
.zhbox p{margin:0 0 .9em}
.zhbox p:last-child{margin:0}

.q{background:var(--card);border:1px solid var(--rule);margin:14px 0 0;scroll-margin-top:142px}
.q-top{padding:16px 22px 14px}
.q-tag{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.q-n{font-family:var(--mono);font-size:13px;font-weight:600}
.q-kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.prompt{font-size:14.5px;line-height:1.85;color:var(--ink-2);margin:0 0 11px;padding-left:11px;border-left:2px solid var(--rule)}
.stem{font-family:var(--read);font-size:16.5px;line-height:1.85;margin:0 0 13px;color:#1a2836}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:9px;font-family:var(--read);font-size:15.5px;line-height:1.6;padding:3px 0;color:#243342}
.opt-k{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding-top:2px;flex:none}
.reveal{display:block;width:100%;text-align:left;margin-top:14px;background:none;border:0;border-top:1px dashed var(--rule);padding:11px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--pen);cursor:pointer}
.reveal:hover{color:var(--ink)}
.reveal::after{content:' ▾'}
.q.open .reveal::after{content:' ▴'}
.q.open .reveal{color:var(--ink-3)}

.body{display:none;border-top:1px solid var(--rule);background:#F7F9FA;padding:18px 22px 20px}
.q.open .body{display:block}
.ans{display:flex;align-items:baseline;gap:10px;margin:0 0 13px;flex-wrap:wrap}
.ans-k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink-3);flex:none;padding-top:2px}
.ans-v{font-family:var(--read);font-size:18px;font-weight:600}
.fills{list-style:none;margin:0 0 13px;padding:0}
.fill{display:flex;gap:11px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--rule)}
.fill-k{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none;width:26px}
.fill-w{font-family:var(--read);font-size:17px;font-weight:600;flex:none}
.fill-n{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.zh{font-size:15px;line-height:1.85;margin:0 0 14px;color:#22323F}
.why{font-size:14.5px;line-height:1.85;margin:0 0 4px;color:#22323F;border-top:1px solid var(--rule);padding-top:12px}
.lines{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.line{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.line-k{font-family:var(--mono);font-size:12.5px;flex:none;width:28px;color:var(--ink-3);padding-top:2px}
.line.right{color:var(--ink)}
.line.right .line-k{color:var(--ink);font-weight:600}
.line.right .line-k::after{content:'✓';display:block;font-size:12px;line-height:1.3}
.line.wrong .line-k{color:var(--miss);opacity:.85}
.line.wrong .line-k::after{content:'✗';display:block;font-size:12px;line-height:1.3}
.evid{margin:15px 0 0;font-family:var(--read);font-size:14.5px;line-height:1.8;color:var(--ink-2);padding-left:13px;border-left:2px solid var(--hl)}
.evid span{font-family:var(--han);font-size:11px;letter-spacing:.14em;color:var(--ink-3);display:block;margin-bottom:3px}

.hl{background-image:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 90%,transparent 90%);background-repeat:no-repeat;background-size:0% 100%;transition:background-size .55s cubic-bezier(.2,.75,.3,1);border-radius:1px}
.hl.on{background-size:100% 100%}

.sample{margin:15px 0 0;border:1px solid var(--rule);border-left:3px solid var(--ink);background:var(--card);padding:16px 20px}
.sample p:not(.note-h){font-family:var(--read);font-size:15.5px;line-height:1.9;color:#1a2836;margin:0 0 1em}
.sample p:last-child{margin-bottom:0}
.bank.wide{grid-template-columns:1fr}
.bank.wide .bank-i{font-size:15px;line-height:1.7;padding:10px 14px}
.note{margin:15px 0 0;border:1px solid var(--rule);background:var(--card);padding:13px 16px}
.note-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.note-i{margin:0;padding:9px 0 0;border-top:1px dotted var(--rule)}
.note-i:first-of-type{border-top:0;padding-top:0}
.term{font-family:var(--read);font-size:16px;font-weight:600}
.pos{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin:0 6px}
.gloss{font-size:14.5px}
.ex{font-family:var(--read);font-size:14px;color:var(--ink-2);line-height:1.7;margin:3px 0 0;display:block}
.ex i{font-family:var(--han);font-style:normal;font-size:13px;color:var(--ink-3);display:block}

.side{position:sticky;top:136px;align-self:start;max-height:calc(100vh - 164px);overflow:auto;padding-right:4px}
@media (max-width:1020px){.side{position:static;max-height:none;scroll-margin-top:136px}}
.side-h{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0 0 3px}
.side-t{font-size:16px;font-weight:600;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.card-list{margin:0;padding:0;list-style:none}
.card-item{border-bottom:1px solid var(--rule);padding:11px 0}
.card-item a{display:block;text-decoration:none;color:inherit}
.card-item a:hover .term{background:var(--hl)}
.jump{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);float:right;padding-top:5px}
.side-note{font-size:12.5px;color:var(--ink-3);line-height:1.7;margin:16px 0 0}
.foot{max-width:var(--maxw);margin:0 auto;padding:0 24px 48px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  body{background:#fff;font-size:10.5pt}
  .top,.side,.reveal,.foot,.zhbtn{display:none!important}
  .wrap{display:block;max-width:none;padding:0}
  .q .body{display:block!important}
  .zhbox{display:block!important}
  .q{break-inside:avoid;border-color:#999;margin-bottom:9pt}
  .passage{break-inside:avoid}
  .hl{background-size:100% 100%!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <p class="eyebrow" id="brand"></p>
    <h1 class="title" id="examTitle"></h1>
    <p class="meta" id="examMeta"></p>
    <nav class="bar" id="nav"></nav>
  </div>
</header>

<div class="wrap"><main id="main"></main><aside class="side" id="side"></aside></div>
<p class="foot" id="foot"></p>

<script>
/* ==========================================================================
   ①  題目與詳解全部寫在下面的 EXAM 物件裡。要改題、加題、修字，只動這裡。

   section（大題）：{ id, label, score, instruction, bank?, groups: [...] }
   group（同一篇文章的題組）：{ passage?, zh?, questions: [...] }
       passage 裡寫 __7__ 就會變成可點的空格，數字對應題號。
       zh 是全文中譯，會做成可展開的按鈕。

   question 依題型三選一：
     選擇題   { n, kind, stem, options:{A..D}, answer:"B", translation, explain:{A..D}, evidence?, notes? }
     單一填答 { n, kind, stem, answerText:"prejudice", why, notes? }
     多格填答 { n, kind, prompt, stem, answers:[{k:"①", w:"字", note:"說明"}], notes? }
   ========================================================================== */
const EXAM = {
  brand: "115-1 高三上 第一次段考",
  title: "115學年度 第一學期 高三上第一次段考 詳解｜Midterm (I)",
  meta: "Instructor: Howard Chang　·　範圍：115-1 Midterm (I)",
  footer: "KGHS 115-1 高三英文 第一次定期考查",
  sections: [
  {
    id:"vo", label:"一、單字慣用語選擇", score:"13% · 每題 1%",
    instruction:"範圍：龍騰B5 L1-L3 單字片語、單字書Ch.9-1~10-1。答案：C C B A D　D A B A C　B D A",
    groups:[{
      questions:[
        { n:1, kind:"形容詞",
          stem:"The venture capitalist remained ______ before investing in the startup, as its impressive growth lacked sufficient proof of sustainable success.",
          options:{A:"keen 熱衷的；敏銳的",B:"frustrated 感到挫折的",C:"wary 提防戒慎的",D:"aggressive 積極進取的；侵略性的"}, answer:"C",
          translation:"這位創投家在投資這家新創公司之前始終保持戒慎，因為它亮眼的成長缺乏足以證明能持續成功的證據。",
          explain:{
            A:"keen 意為「熱衷的」（be keen on sth）或「敏銳的」，是積極正面的態度；但 as 引導的原因子句說它 lacked sufficient proof（缺乏足夠證據），這是讓人踩剎車的理由，不是讓人躍躍欲試的理由。",
            B:"frustrated 意為「感到挫折的」，指努力卻不得其果的情緒；但創投家還沒投資（before investing），尚未經歷挫敗，情緒上對不上。",
            C:"wary 意為「提防、戒慎」，指因為心存疑慮而不敢輕舉妄動。兩個線索：時間副詞 before investing（在投資之前）說明他還在觀察階段，而原因子句 lacked sufficient proof of sustainable success（缺乏可持續成功的充分證據）正是他不敢貿然出手的理由。remain wary 是常見搭配。",
            D:"aggressive 意為「積極進取的」或「侵略性強的」。若創投家態度積極，就會直接投資，與 before investing 的觀望狀態矛盾；而且後面的原因子句是負面的。"
          },
          notes:[
            {term:"be / remain wary of", pos:"phr.", gloss:"對…提防、戒慎（＝be cautious about）。n. wariness", ex:"Investors remain wary of the new market.", exZh:"投資人對這個新市場仍抱持戒心。"},
            {term:"venture capitalist", pos:"n.", gloss:"創業投資家、創投（venture capital 創投資金；n. venture 創業、冒險事業）"}
          ]},

        { n:2, kind:"形容詞",
          stem:"Yayoi Kusama's mirrored rooms challenge our ______ experiences, making familiar small spaces appear infinite.",
          options:{A:"symbolic 象徵性的",B:"theoretical 理論上的",C:"perceptual 知覺的、感官認知的",D:"indecisive 猶豫不決的"}, answer:"C",
          translation:"草間彌生的鏡屋挑戰我們的知覺經驗，讓熟悉的小空間看起來無限寬廣。",
          explain:{
            A:"symbolic 意為「象徵性的」，指用某物代表抽象意涵；但鏡屋改變的是觀者眼睛所看到的實際感受，不是符號的解讀。",
            B:"theoretical 意為「理論上的」，形容學說或假設；但 making familiar small spaces appear infinite（讓小空間看起來無限）講的是親身的視覺體驗，不是紙上的理論。",
            C:"perceptual 意為「知覺的、感官認知的」。線索是分詞構句 making familiar small spaces appear infinite（讓熟悉的小空間看起來無限寬廣）——鏡子改變的正是我們對空間大小的感官判斷，也就是知覺。",
            D:"indecisive 意為「猶豫不決的」，形容人做決定的態度，不能形容 experiences（經驗）。"
          },
          notes:[
            {term:"perceptual", pos:"adj.", gloss:"知覺的、感官認知的（v. perceive 察覺；n. perception 知覺、看法）", ex:"The illusion plays on our perceptual limits.", exZh:"這個錯覺利用了我們知覺的極限。"},
            {term:"make + O + 原形V", pos:"句型", gloss:"使…（做某事）。make small spaces appear infinite ＝ 讓小空間看起來無限。appear 後面接形容詞當補語。"}
          ]},

        { n:3, kind:"名詞",
          stem:"Nothing could shake her ______ to complete the marathon, not even the blisters that had been steadily worsening since the tenth kilometer of the race.",
          options:{A:"tendency 傾向",B:"resolve 決心",C:"privilege 特權",D:"obligation 義務"}, answer:"B",
          translation:"沒有任何事能動搖她完成這場馬拉松的決心，連從第十公里起就持續惡化的水泡也不能。",
          explain:{
            A:"tendency 意為「傾向」，指經常如此的習性（a tendency to procrastinate 拖延的傾向）；但傾向不是意志，不會被「動搖」，而且搭配的介系詞雖然也是 to，語意卻不符。",
            B:"resolve 當名詞意為「決心」，固定搭配是 shake one's resolve（動搖某人的決心）與 one's resolve to V。兩個線索：動詞 shake（動搖）只有意志力才需要被動搖，而 not even the blisters that had been steadily worsening（連持續惡化的水泡也不能）則是用極端的阻礙來反襯這份決心有多強。",
            C:"privilege 意為「特權、殊榮」，是外界給予的權利；完成馬拉松是自己要達成的目標，不是別人賦予的特權。",
            D:"obligation 意為「義務」，是不得不做的責任；但本句的語氣是讚揚她的主動堅持，而非被迫履行。這是本題最需要分辨的選項：義務來自外部，決心來自內心。"
          },
          notes:[
            {term:"shake one's resolve", pos:"phr.", gloss:"動搖某人的決心。resolve 當名詞是「決心」（one's resolve to V）；adj. resolute 堅決的", ex:"Nothing shook his resolve to finish the project.", exZh:"沒有任何事動搖他完成這個計畫的決心。"},
            {term:"not even ...", pos:"用法", gloss:"連…都不。放在否定句之後，用極端的例子加強前面的否定語氣。"}
          ]},

        { n:4, kind:"動詞",
          stem:"The sudden collapse of the currency ______ their life savings virtually worthless, wiping out years of careful household budgeting in a single month.",
          options:{A:"rendered 使成為",B:"declared 宣布、聲明",C:"exposed 暴露、揭露",D:"undermined 暗中削弱"}, answer:"A",
          translation:"貨幣的突然崩盤使他們畢生的積蓄形同一文不值，一個月之內就抹掉了多年來謹慎的家庭理財成果。",
          explain:{
            A:"render + 受詞 + 形容詞 意為「使…變成…」。結構線索很明確：空格後是受詞 their life savings 加上形容詞補語 virtually worthless，正是這個雙受詞句型；而 wiping out years of careful household budgeting（抹掉多年的理財成果）也印證了這個「使之變成」的結果。",
            B:"declare 雖然也能接受詞加補語（declare him the winner），但它的主詞必須是有宣告能力的人或機構；貨幣崩盤是客觀事件，不會「宣布」什麼。這是結構相同、主詞不合的誘答。",
            C:"expose 意為「暴露、揭露」，後面接受詞或 expose A to B，不接形容詞補語；而且積蓄是變得沒價值，不是被揭發。",
            D:"undermine 意為「暗中削弱」，強調的是緩慢而隱蔽的侵蝕過程；但本句的 sudden collapse（突然崩盤）與 in a single month（一個月之內）都強調又快又猛，語感相反。"
          },

        zh:"近年來，道路安全已成為臺灣日益迫切的公共議題，尤其是高齡駕駛所帶來的挑戰，促使當局重新檢討現行法規。從過去以來，臺灣對這個議題一向謹慎處理，偏好漸進改革而非全面翻修，這個理念長久以來已深織於臺灣道路安全政策的肌理之中。然而改變正在加速：自二○二六年五月起，強制換照的年齡門檻已從七十五歲降至七十歲。\n\n在新制度下，七十到七十四歲的駕駛必須通過體檢並完成道路安全課程才能換照；符合這些條件者可保有駕照至七十五歲。隨著駕駛年齡增長，要求也更加嚴格：從七十五歲起，駕照必須每三年更換一次，而且駕駛還必須額外接受認知功能測驗，以偵測記憶、方向感或反應時間受損的早期徵兆。為了維持這個程序的公信力，測驗由領有執照的專業人員施測，而非交由自我評估。那些無法證明自己仍適合駕駛的人，可能會被要求繳回駕照。這些措施反映了道路安全政策的根本轉向，在高齡駕駛的自由與維護公眾安全的需求之間取得平衡。",

      {
        passage:"(D) The elevator display reads “433,” the number of meters below ground. The doors slide open, revealing the entrance to what is expected to be the world's first permanent repository for radioactive spent nuclear fuel. Securely __29__ deep inside 1.9-billion-year-old stable bedrock in southwest Finland, the geological repository for spent nuclear waste is nearly ready to start operations. Known as Onkalo, meaning “cave” in Finnish, the facility has been __30__ since 2004, gradually forming a vast network of underground tunnels.\n\nBefore being transported underground, highly radioactive fuel rods will be encapsulated in highly __31__ copper canisters to prevent gradual metal oxidation. The canisters will then be lowered into holes drilled in the tunnels, before the holes are filled with bentonite clay to seal them. When wet, this special clay expands, helping __32__ water __32__ reaching the waste. Finally, once each 300-meter-long disposal tunnel is filled, it will be sealed with a steel-reinforced concrete plug.\n\nSo far, Onkalo has received broad backing in Finland. Supporters argue that Onkalo offers an answer to one of nuclear energy's biggest questions: what to do with dangerous waste. __33__ , experts warn that the long-term risks of geological shifts during future ice ages remain difficult to predict. Whatever the future may bring, Onkalo is set to play a major role in Finland's long-term approach to nuclear waste.\n\n（第 32 題的空格為一題兩格：helping ______ water ______ reaching the waste）",
        zh:"電梯顯示器上寫著「433」，那是地下的公尺數。門滑開，露出通往預計將成為世界第一座放射性用過核燃料永久處置場的入口。這座用過核廢料的地質處置場安穩地建造在芬蘭西南部一塊十九億年歷史的穩定岩床深處，如今已幾乎準備好開始運轉。這座設施名為 Onkalo，在芬蘭文中意為「洞穴」，自二○○四年起一直在施工中，逐漸形成一個龐大的地下隧道網。\n\n在被運送到地下之前，高放射性的燃料棒會被封裝在高度耐腐蝕的銅罐之中，以防止金屬逐漸氧化。這些罐子接著會被降入隧道中鑽好的孔洞，然後以膨潤土黏土填滿孔洞加以封閉。這種特殊的黏土遇水會膨脹，有助於阻擋水接觸到廢料。最後，每一條三百公尺長的處置隧道一旦填滿，就會以鋼筋混凝土塞封住。\n\n到目前為止，Onkalo 在芬蘭獲得廣泛的支持。支持者主張 Onkalo 為核能最大的難題之一提供了答案：危險的廢料該怎麼處理。儘管如此，專家警告，未來冰河期地質變動的長期風險仍然難以預測。無論未來如何，Onkalo 都將在芬蘭長期的核廢料處理方針中扮演重要角色。",

      {
        passage:"(E) In an Assam tea garden, a drainage ditch is barely a meter deep. While such a trench is a small inconvenience to a grown elephant, it can be __34__ to a calf that has never learned to navigate rough ground. Young elephants often slip in and cannot climb out, and mothers that dig at the soft walls to reach them may be trapped by the falling mud. Since elephants generally do not desert an injured companion, a whole herd may __35__ beside a ditch for hours, waiting for a calf that cannot rise.\n\nFor decades Assam's tea gardens have pushed into the forest belts that once separated farmland from reserved land. Elephants travel by memory, following the routes their families have used for generations. With their ancient corridors __36__ beneath neat rows of tea, the herds have no way around the plantations and must walk straight through them. Once inside, the animals find little to eat, since tea leaves are of no use to them. Worse still, many villagers walking home through the fenced plantations after dark are killed when they encounter elephants. In fact, nearly 800 people have died in Assam in the past decade. Fences do little to deter an animal weighing several tons. __37__ , they become obstacles to the villagers' escape.\n\nTo foster peaceful coexistence between villagers and elephants, organizations like Elephant Friendly Tea certify gardens that take __38__ against accidents, such as filling trenches and leaving old corridors open. Through these efforts, the organization hopes to raise public awareness of eco-friendly farming.",
        zh:"在阿薩姆的茶園裡，一條排水溝深度不到一公尺。對一頭成年象來說，這樣的溝渠只是個小小的不便，但對一隻從未學會如何走過崎嶇地面的小象而言，它可能是致命的危險。幼象常常滑進去又爬不出來，而在軟土壁上挖掘想要接近牠們的母象，則可能被塌落的泥土困住。由於大象通常不會拋棄受傷的同伴，整個象群可能在溝邊徘徊數小時，等著一隻爬不起來的小象。\n\n數十年來，阿薩姆的茶園不斷向森林帶推進，那些森林帶曾經是農地與保留地之間的分隔。大象靠記憶移動，沿著家族世代使用的路線前進。隨著牠們古老的廊道被埋在整齊的茶樹行列之下，象群無法繞過這些茶園，只能直接穿越。一旦進入其中，這些動物找不到什麼可吃的東西，因為茶葉對牠們毫無用處。更糟的是，許多村民在天黑後穿越圍起來的茶園返家時，遭遇大象而喪命。事實上，過去十年間阿薩姆已有將近八百人死亡。圍籬對一頭重達數噸的動物幾乎毫無嚇阻作用。反而，它們成了村民逃生的障礙。\n\n為了促進村民與大象的和平共存，像「大象友善茶」這樣的組織會為那些採取預防措施以避免意外的茶園提供認證，例如填平溝渠、保留舊有廊道暢通。透過這些努力，該組織希望提升公眾對生態友善農法的認識。",
        questions:[

    bankWide:true,
    groups:[{
      passage:"Imagine growing up in a place where nature was hidden behind polluted rivers and smoke-filled skies. This was the childhood experience of Thomas Moran, who was born in northwest England during the grim age of the Industrial Revolution. Ironically, the __39__ of natural beauty inspired him to become one of America's most influential landscape painters and helped set the stage for the creation of national parks.\n\nMoran's family immigrated to Philadelphia when he was seven. Inspired by the British master J.M.W. Turner, Moran began painting at fifteen and soon displayed remarkable talent. He quickly rose to prominence, and by age 34, he was __40__ chief illustrator of Scribner's Monthly. A turning point in his career came in 1871 when he was asked to illustrate an article about the Yellowstone region. The author's descriptions of the region's mysterious landscapes captivated Moran, making him eager to explore this unfamiliar __41__ himself.\n\nLater that year, Moran joined the first official government __42__ to Yellowstone with photographer William Henry Jackson. The journey had a profound impact on Moran's artistic career. For two weeks, Moran worked tirelessly, capturing the beauty and power of the wilderness through detailed sketches. Upon their return, the survey team __43__ their findings, including Moran's vibrant watercolors, Jackson's photographs, and the survey results, to the U.S. Congress.\n\nAt that time, many people had __44__ Yellowstone as a harsh, hellish wilderness. However, Moran's artwork revealed the true splendor of the landscape and fired the imagination of lawmakers. In March 1872, Congress __45__ Yellowstone as the world's first national park. Throughout the rest of his life, Moran continued to __46__ the American West, inspiring the protection of a dozen other areas that are now celebrated as national parks or national monuments.",
      zh:"想像一下在一個自然被污濁河流與濃煙瀰漫的天空所遮蔽的地方長大。這就是湯瑪斯．莫蘭的童年經驗，他出生於工業革命那個陰鬱年代的英格蘭西北部。諷刺的是，正是自然之美的匱乏激勵他成為美國最具影響力的風景畫家之一，並協助為國家公園的誕生奠下基礎。\n\n莫蘭七歲時全家移民到費城。受到英國大師透納的啟發，莫蘭十五歲開始作畫，很快就展現出非凡的才華。他迅速崛起，到三十四歲時已被任命為《斯克里布納月刊》的首席插畫家。他生涯的轉折點出現在一八七一年，當時他受託為一篇關於黃石地區的文章繪製插圖。作者對該地區神秘地景的描述深深吸引了莫蘭，使他渴望親自去探索這片陌生的疆域。\n\n那年稍晚，莫蘭與攝影師威廉．亨利．傑克森一同加入了政府首次的官方黃石探勘隊。這趟旅程對莫蘭的藝術生涯產生了深遠的影響。整整兩週，莫蘭不辭辛勞地工作，透過細膩的素描捕捉這片荒野的美麗與力量。返回之後，探勘團隊把他們的發現呈交給美國國會，其中包括莫蘭色彩鮮明的水彩畫、傑克森的照片，以及勘查結果。\n\n在那個時候，許多人把黃石視為一片嚴酷而如地獄般的荒野、不值一顧。然而莫蘭的作品揭示了這片地景真正的壯麗，點燃了立法者的想像。一八七二年三月，國會將黃石設立為世界第一座國家公園。在他餘生之中，莫蘭持續記錄美國西部，促成了另外十餘個地區受到保護，那些地方如今都被譽為國家公園或國家紀念區。",

    bankWide:true,
    groups:[{
      passage:"Penang has a long and fascinating history. In 1786, British Captain Francis Light __47__ this island on behalf of the British East India Company. When he raised the British flag over Penang then, he imagined a harbor, a sheltered anchorage at the northern entrance of the Strait of Malacca, where ships could stop, make repairs, and trade without paying duties. Almost everything the city later became grew out of that one commercial decision.\n\nThe sea did the rest. The free port attracted __48__ ships from Sumatra, Siam, Canton, and Madras, and many people aboard them never went home. Chinese carpenters, Indian moneylenders, Arab spice merchants, and Malay boatmen settled along the shore, organizing themselves around family and clan __49__ rather than around any plan drawn up in Britain. Villages rose on wooden stilts above the water, close enough to the harbor to catch the first cargo of the morning.\n\nTheir descendants __50__ a way of life born from generations of borrowing. A single shophouse might combine Chinese shutters, European arches, Malay woodwork, and Portuguese floor tiles without anyone finding the combination strange. The same habit shaped the city's kitchens: a bowl of Penang laksa contains sour tamarind from Malay cooking, noodles from China, and chilies from the Americas. Few cities of comparable size can __51__ this density of influences.\n\nThe process has not stopped. Since 2008, when UNESCO recognized the old town, George Town has become as much a(n) __52__ canvas as a preserved one. Its most photographed sights today are not colonial doorways but a series of murals, the __53__ of a Lithuanian artist who spent one summer painting on shophouse walls, images now as local as anything around them.\n\nYet the same recognition that draws visitors also lifts rents. Long-settled families sell to developers, and young people leave for Kuala Lumpur in __54__ of higher wages. A city that grew because strangers chose to stay may now be reshaped by residents who choose to go.",
      zh:"檳城有一段漫長而引人入勝的歷史。一七八六年，英國船長法蘭西斯．萊特代表英國東印度公司取得了這座島嶼。當時他在檳城升起英國國旗，心中想像的是一座港口——麻六甲海峽北端一處有遮蔽的泊地，船隻可以在此停靠、修補、並免稅貿易。這座城市後來成為的幾乎一切，都是從那一個商業決定長出來的。\n\n剩下的就由海洋完成。這座自由港吸引了來自蘇門答臘、暹羅、廣州與馬德拉斯的路過船隻，而船上許多人再也沒有回家。華人木匠、印度錢莊業者、阿拉伯香料商與馬來船夫沿著海岸定居下來，依著家族與宗親的聯繫而非任何在英國擬定的計畫來組織自己。村落建在水面上的木樁之上，離港口近得足以搶到清晨第一批貨。\n\n他們的後代承繼了一種從世代相互借用中誕生的生活方式。一間店屋可能同時結合華人的百葉窗、歐式拱門、馬來木作與葡萄牙地磚，而沒有人覺得這樣的組合奇怪。同樣的習性也形塑了這座城市的廚房：一碗檳城叻沙裡有來自馬來料理的酸羅望子、來自中國的麵，以及來自美洲的辣椒。很少有同等規模的城市能比得上這種影響交融的密度。\n\n這個過程並未停止。自二○○八年聯合國教科文組織認定這座老城以來，喬治市已經成為一塊既被保存、同時也仍在不斷演變的畫布。今天它最常被拍攝的景點不是殖民時期的門廊，而是一系列壁畫，那是一位立陶宛藝術家的作品，他花了一個夏天在店屋牆上作畫，那些圖像如今已和周遭的一切同樣在地。\n\n然而，同一份為它帶來遊客的認定，也推高了租金。長年定居的家族把房子賣給開發商，年輕人則為了尋求更高的工資而前往吉隆坡。一座因為陌生人選擇留下而成長的城市，如今可能被選擇離開的居民重新塑造。",

    bank:{A:"This high degree of driving freedom was made possible by substantial investments in infrastructure.　這種高度的駕駛自由，是靠著對基礎建設的大量投資才得以實現。",B:"This policy has reinforced Germany's reputation for automotive engineering and supported a vibrant motorsport scene.　這項政策強化了德國在汽車工程上的聲譽，也支撐了蓬勃的賽車運動風氣。",C:"The opportunity to drive at high speeds turned the Autobahn into a demanding testing ground for automobile manufacturers.　高速行駛的機會把高速公路變成了汽車製造商嚴苛的試驗場。",D:"As an engineering feat, the Autobahn reflects Germany's commitment to prioritizing AI-assisted monitoring system.　作為一項工程成就，高速公路反映了德國優先推動 AI 輔助監測系統的決心。（干擾選項）",E:"The Autobahn is far more than a network of highways; it has become a symbol of Germany's engineering excellence and driving culture.　高速公路遠不只是一個公路網；它已成為德國工程卓越與駕駛文化的象徵。"},
    bankWide:true,
    groups:[{
      passage:"Around the world, modern traffic management is increasingly relying on automated enforcement and AI-assisted monitoring to discourage speeding. While many nations impose strict speed limits on their highways, Germany offers a striking contrast through its Autobahn network. On many sections of these highways, there is no permanent speed limit. __55__\n\nThe origins of this driving culture can be traced back to the mid-twentieth century. During the postwar reconstruction, West Germany rebuilt and expanded the Autobahn network as part of its economic recovery. The highways were viewed not only as a vital transportation network but also as a symbol of mobility and national progress. Rather than introducing a nationwide speed limit, Germany chose to leave many sections unrestricted. __56__ German authorities built well-engineered highways, maintained them regularly, and complemented these efforts with rigorous driver-training programs. As a result, the Autobahn developed into a safe environment for high-speed travel rather than a dangerous free-for-all.\n\nThese conditions also transformed Germany's automobile industry. __57__ To ensure safety at speeds exceeding 200 km/h, engineers at companies such as Porsche, BMW, and Mercedes-Benz refined vehicle aerodynamics, handling, and braking systems. As German cars gained an international reputation for quality and performance, high-performance engineering became an important part of the country's national identity and inspired widespread enthusiasm for motorsport. This culture also produced internationally renowned racing drivers, such as Michael Schumacher, and established Germany as a dominant force in global motorsport.\n\n__58__ While growing concerns about road safety, environmental protection, and new transportation technologies continue to fuel debates over speed limits, the Autobahn remains closely connected to Germany's automotive heritage. It demonstrates how a unique transportation policy, coupled with strong engineering standards and responsible driving practices, can shape a country's identity in the global automotive world.",
      zh:"世界各地的現代交通管理，越來越倚賴自動化執法與 AI 輔助監測來抑制超速。雖然許多國家對其高速公路實施嚴格的速限，德國卻透過它的 Autobahn 公路網呈現出鮮明的對比。在這些公路的許多路段上，並沒有永久性的速限。這項政策強化了德國在汽車工程上的聲譽，也支撐了蓬勃的賽車運動風氣。\n\n這種駕駛文化的起源可以追溯到二十世紀中葉。在戰後重建期間，西德把 Autobahn 公路網的重建與擴張當作經濟復甦的一部分。這些公路不僅被視為重要的運輸網絡，也被視為機動性與國家進步的象徵。德國沒有引入全國性的速限，而是選擇讓許多路段不受限制。這種高度的駕駛自由，是靠著對基礎建設的大量投資才得以實現。德國當局建造了工程品質優良的公路、定期維護，並以嚴格的駕駛訓練計畫相輔相成。結果，Autobahn 發展成一個適合高速行駛的安全環境，而不是危險的亂無秩序。\n\n這些條件也改造了德國的汽車工業。高速行駛的機會把 Autobahn 變成了汽車製造商嚴苛的試驗場。為了確保在時速超過兩百公里下的安全，保時捷、BMW 與賓士等公司的工程師精進了車輛的空氣力學、操控與煞車系統。隨著德國車在品質與性能上贏得國際聲譽，高性能工程成為這個國家國族認同的重要部分，也激起了對賽車運動的廣泛熱情。這種文化還培育出國際知名的賽車手，例如麥可．舒馬克，並使德國成為全球賽車運動的主導力量。\n\nAutobahn 遠不只是一個公路網；它已成為德國工程卓越與駕駛文化的象徵。雖然對道路安全、環境保護與新運輸科技日益升高的關切，持續激起關於速限的辯論，Autobahn 仍與德國的汽車傳統緊密相連。它展現了一項獨特的運輸政策，在強大的工程標準與負責任的駕駛習慣相配合之下，如何形塑一個國家在全球汽車世界中的身分。",
      questions:[

  {
    id:"rc", label:"五、閱讀測驗", score:"8% · 每題 2%",
    instruction:"超級食物（superfood）的行銷與代價。答案：59 C　60 B　61 B　62 D",
    groups:[{
      passage:"Wander through any supermarket today and you will inevitably encounter shelves devoted to items marketed as “superfoods”: kale, chia seeds, acai berries, turmeric, each promising benefits that range from disease prevention to the deceleration of aging itself. However, nutrition scientists have grown markedly skeptical of the term, which possesses no formal scientific definition and originated not in a research institution but in a marketing campaign nearly a century ago.\n\nThe term first entered common usage in the early twentieth century, when banana growers sought a way to distinguish their product amid a crowded produce market. In the decades since, the superfood label has been applied so liberally, to everything from blueberries to bone broth, that its meaning has become almost meaningless from a scientific standpoint. What unites these foods is not the shared nutritional composition but a shared marketing appeal: each is framed as an easy, almost magical shortcut to health, allowing consumers to believe that a single ingredient is capable of offsetting an otherwise unbalanced diet.\n\nNone of this is to suggest the foods themselves are nutritionally negligible. Kale is genuinely rich in vitamins and antioxidant compounds; chia seeds do supply fiber and omega-3 fatty acids in appreciable quantities. The concern researchers raise is less about the foods and more about the psychology the superfood label exploits. Behavioral economists have documented what they term the “health halo effect”: when a product is marketed as exceptionally virtuous, consumers subconsciously grant themselves license to indulge elsewhere in their diet, as though nutritional merit were a currency that could be banked and later spent. A shopper who purchases an acai bowl may unconsciously justify an unhealthy meal later, believing their diet has already been “balanced” by the earlier virtuous choice.\n\nCompounding the issue is the environmental and economic cost hidden behind the superfood label. As global demand for quinoa surged following its elevation to superfood status, prices within its native Andean region climbed so sharply that many local families found the very staple that had sustained their ancestors for generations priced beyond their own reach. The pursuit of nutritional virtue among wealthy consumers thousands of miles away, in other words, can impose costs on populations wholly excluded from that pursuit's benefits. Ultimately, nutritionists share a broad consensus that no single food, however nutrient-dense, can substitute for holistic dietary variety, a conclusion much less marketable than a miracle ingredient, but far nearer the truth.",
      zh:"今天走進任何一家超市，你一定會看到專門擺放標榜為「超級食物」商品的貨架：羽衣甘藍、奇亞籽、巴西莓、薑黃，每一樣都承諾著從預防疾病到延緩老化本身的各種益處。然而營養科學家對這個詞已變得明顯存疑，因為它沒有正式的科學定義，而且它的起源不是研究機構，而是將近一世紀前的一場行銷活動。\n\n這個詞最早在二十世紀初進入日常用語，當時香蕉種植業者想找個辦法讓自家產品在擁擠的農產市場中突顯出來。在那之後的幾十年間，超級食物這個標籤被濫用到了什麼都能貼的程度，從藍莓到骨頭高湯，以至於從科學的角度看它的意義幾乎等於零。把這些食物串在一起的並不是共同的營養成分，而是共同的行銷賣點：每一樣都被包裝成通往健康的一條簡便、近乎神奇的捷徑，讓消費者相信單一種食材就足以抵銷一份原本並不均衡的飲食。\n\n這一切並不是在暗示這些食物本身的營養可以忽略不計。羽衣甘藍確實富含維生素與抗氧化化合物；奇亞籽也確實提供可觀數量的纖維與 omega-3 脂肪酸。研究者提出的疑慮，比較不在於食物本身，而更在於超級食物這個標籤所利用的心理。行為經濟學家記錄了他們稱為「健康光環效應」的現象：當一項產品被行銷成格外有益時，消費者會下意識地允許自己在飲食的其他地方放縱，彷彿營養上的功德是一種可以先存起來、之後再花掉的貨幣。一個買了巴西莓果碗的消費者，可能會下意識為自己之後的一頓不健康餐食找理由，相信自己的飲食已經被先前那個有益的選擇「平衡」掉了。\n\n讓問題更加複雜的，是藏在超級食物標籤背後的環境與經濟代價。隨著藜麥被捧上超級食物的地位、全球需求激增，它原產的安地斯山區價格飆漲得如此劇烈，使得許多當地家庭發現那個世代養育他們祖先的主食，價格已經超出他們自己的負擔能力。換句話說，數千英里之外富裕消費者對營養美德的追求，可能把代價加在那些完全被排除在這份追求的好處之外的人群身上。最終，營養學家有一個廣泛的共識：沒有任何單一食物，無論營養密度多高，能夠取代整體飲食的多樣性——這個結論遠不如一種神奇食材那麼好賣，卻離真相近得多。",
      questions:[
        { n:59, kind:"主旨細節 (2%)",
          stem:"According to the passage, why are nutrition scientists concerned about the term “superfood”?",
          options:{A:"The term was invented specifically to mislead consumers about the safety of imported produce. 這個詞是專為了誤導消費者對進口農產品安全性的認知而發明的。",B:"Research has shown that the nutritional claims made about foods like kale and chia seeds are false. 研究顯示關於羽衣甘藍與奇亞籽等食物的營養聲稱是不實的。",C:"The term lacks an agreed scientific definition and marketers use it to take advantage of consumers. 這個詞缺乏公認的科學定義，而行銷人員利用它來占消費者的便宜。",D:"The foods marketed under this label are typically less nutritious than their conventional counterparts. 掛上這個標籤的食物通常比一般同類食物更不營養。"}, answer:"C",
          translation:"根據本文，營養科學家為何對「超級食物」這個詞感到憂慮？",
          explain:{
            A:"動機與對象都被改寫了。原文說這個詞 originated ... in a marketing campaign（起源於一場行銷活動），目的是 banana growers sought a way to distinguish their product（香蕉業者想讓產品突顯），那是為了促銷而非為了誤導安全性；而且全文從未談過 imported produce（進口農產品）的安全問題。",
            B:"原文明確否認了這一點。第三段開頭就說 None of this is to suggest the foods themselves are nutritionally negligible（這並不是說這些食物本身營養可忽略），接著還肯定 Kale is genuinely rich in vitamins（羽衣甘藍確實富含維生素）、chia seeds do supply fiber（奇亞籽確實提供纖維）。科學家質疑的是標籤，不是食物。",
            C:"兩個理由都在第一段與第三段找得到。第一段：which possesses no formal scientific definition（沒有正式科學定義）對應 lacks an agreed scientific definition；第三段：the psychology the superfood label exploits（這個標籤所利用的心理）與 health halo effect（健康光環效應）對應 marketers use it to take advantage of consumers。兩個要素齊備。",
            D:"程度被捏造了。原文從未把超級食物與一般食物做營養比較，反而肯定了它們的營養價值。這是把「標籤沒意義」誤讀成「食物比較差」。"
          },
          notes:[
            {term:"區分「標籤」與「食物」", pos:"技巧", gloss:"本文的核心論點是 The concern ... is less about the foods and more about the psychology。看到選項在攻擊食物本身，就可以先刪掉。"},
            {term:"skeptical of", pos:"adj.", gloss:"對…存疑（be skeptical of／about sth）。n. skepticism；n. skeptic 懷疑論者"}
          ]},

        { n:60, kind:"字義推論 (2%)",
          stem:"In the third paragraph, which of the following best captures the meaning of the phrase “a currency that could be banked and later spent”?",
          options:{A:"It refers to how expensive superfoods are compared to regular fruits and vegetables. 它指的是超級食物與一般蔬果相比有多昂貴。",B:"It means people mentally save up healthy choices to justify eating unhealthy food later. 它意指人們在心理上把健康的選擇存起來，用以為之後吃不健康的食物找理由。",C:"It explains how food companies calculate the profits they make from marketing superfoods. 它說明食品公司如何計算行銷超級食物所賺得的利潤。",D:"It suggests that buying superfoods helps consumers spend less money on groceries over time. 它暗示購買超級食物能幫消費者長期省下食品雜貨的錢。"}, answer:"B",
          translation:"在第三段中，下列哪一項最能掌握「一種可以先存起來、之後再花掉的貨幣」這個片語的意思？",
          explain:{
            A:"被字面上的 currency（貨幣）誤導了。這個片語是比喻，as though（彷彿）一詞已經明示它不是真的在談錢；而且全文談超級食物的價格是在第四段的藜麥部分，與第三段的心理機制無關。",
            B:"片語的上下文就是解答。前半句說 consumers subconsciously grant themselves license to indulge elsewhere in their diet（消費者下意識允許自己在飲食別處放縱），後面的例子更具體：A shopper who purchases an acai bowl may unconsciously justify an unhealthy meal later（買了巴西莓果碗的人可能為之後的不健康餐食找理由）。把營養功德當成「可存可花的貨幣」，正是這種心理記帳。",
            C:"主體弄錯了。這個比喻描述的是「消費者」的心理，不是「食品公司」的會計作業；banked and spent 的主詞是 nutritional merit（營養上的功德），不是利潤。",
            D:"方向完全相反，而且無憑無據。原文從未說超級食物能幫人省錢，第四段反而指出它推高了藜麥價格。"
          },
          notes:[
            {term:"as though 是比喻的訊號", pos:"技巧", gloss:"as though／as if 之後的內容是假設性的比擬，不可照字面理解。看到它就知道該往前後文找這個比喻在說什麼道理。"},
            {term:"health halo effect", pos:"n.", gloss:"健康光環效應：某產品被貼上健康標籤後，人們高估它的益處並放寬其他飲食的自我要求。"}
          ]},

        { n:61, kind:"作者意圖 (2%)",
          stem:"What does the author intend to emphasize with the final sentence's contrast between what is “marketable” and what is “nearer the truth”?",
          options:{A:"Many nutritionists disagree on what foods qualify as beneficial. 許多營養學家對哪些食物算有益看法不一。",B:"An easily marketed claim leads consumers to overlook the plain truth. 容易行銷的說法會讓消費者忽略那個平實的真相。",C:"Consumers become skeptical of food marketed as exceptionally healthy. 消費者會對被行銷為格外健康的食物產生懷疑。",D:"Superfoods are financially profitable but nutritionally worthless for consumers. 超級食物在財務上有利可圖，但對消費者毫無營養價值。"}, answer:"B",
          translation:"作者在最後一句中對比「好賣的」與「離真相更近的」，意在強調什麼？",
          explain:{
            A:"與原文直接矛盾。最後一句明寫 nutritionists share a broad consensus（營養學家有廣泛的共識），而非意見分歧。這是把 consensus 讀反了。",
            B:"最後一句的對比結構是關鍵：a conclusion much less marketable than a miracle ingredient, but far nearer the truth（這個結論遠不如神奇食材好賣，卻離真相近得多）。作者把「好賣」與「真實」擺在對立面，正是在惋惜真相因為不吸引人而被忽略。而第二段的 a shared marketing appeal（共同的行銷賣點）也鋪陳了同樣的批評。",
            C:"主詞被換掉了。第一段說變得存疑的是 nutrition scientists（營養科學家），不是消費者；全文反而描述消費者容易被標籤說服（health halo effect）。",
            D:"後半句過度延伸。原文第三段明確肯定這些食物的營養價值（Kale is genuinely rich in vitamins），所以 nutritionally worthless（毫無營養價值）不成立。這是最需要分辨的選項：有利可圖是對的，毫無營養是錯的，一半對不算對。"
          },
          notes:[
            {term:"對比句的作者立場", pos:"技巧", gloss:"A but B 的結構中，作者的立場通常落在 but 之後。本句 but far nearer the truth 才是作者要人記住的重點。"},
            {term:"一半對的選項", pos:"技巧", gloss:"選項前半正確、後半誇大，是閱讀測驗最常見的陷阱。四個選項都要讀完整句再判斷。"}
          ]},

        { n:62, kind:"圖表判讀 (2%)",
          stem:"Based on the graph (quinoa export prices, 2004-2024), which of the following best reflects the trend mentioned in the LAST paragraph?",
          options:{A:"The graph proves that superfood marketing caused quinoa's nutritional value to increase between 2004 and 2024. 此圖證明超級食物行銷使藜麥的營養價值在二○○四至二○二四年間提高。",B:"The rise in export prices directly disproves the passage's claim that quinoa became less affordable for Andean families. 出口價格的上漲直接反駁了本文所稱藜麥對安地斯家庭變得更難負擔的說法。",C:"The graph shows that quinoa prices gradually fell after 2010, contradicting the passage's account of the “health halo effect.” 此圖顯示藜麥價格在二○一○年後逐漸下跌，與本文對「健康光環效應」的敘述相矛盾。",D:"In the past two decades, the rising global demand for quinoa drove prices beyond the reach of the people who traditionally relied on it. 在過去二十年間，全球對藜麥日增的需求使價格高漲到超出傳統上依賴它的人們的負擔能力。"}, answer:"D",
          translation:"根據圖表（藜麥出口價格，二○○四至二○二四年），下列哪一項最能反映最後一段所提到的趨勢？",
          explain:{
            A:"把兩件不相干的事混在一起了。價格圖表只能顯示價格的變化，無法證明任何關於 nutritional value（營養價值）的事；而且營養價值不會因為行銷而改變。",
            B:"邏輯方向顛倒。出口價格上漲正是原文所說 prices ... climbed so sharply that many local families found the very staple ... priced beyond their own reach（價格飆漲到當地家庭負擔不起）的證據，它支持而非反駁原文。",
            C:"與圖表趨勢相反。本題圖表顯示的是價格上升，而非 fell after 2010（二○一○年後下跌）；而且健康光環效應是第三段的心理機制，與第四段的價格問題不是同一回事。",
            D:"完整對應最後一段的因果鏈：global demand for quinoa surged（全球需求激增）→ prices ... climbed so sharply（價格飆漲）→ priced beyond their own reach（超出當地家庭負擔）。而 the people who traditionally relied on it（傳統上依賴它的人）正是原文 the very staple that had sustained their ancestors for generations（世代養育其祖先的主食）所指的對象。"
          },
          notes:[
            {term:"圖表題的作法", pos:"技巧", gloss:"圖表題考的是「圖與文是否一致」。先確認圖的趨勢方向（本題為上升），再逐一刪掉方向錯誤、超出圖表所能證明範圍的選項。"},
            {term:"staple", pos:"n.", gloss:"主食、主要產品（rice is a staple in Asia）。adj. staple 主要的、基本的"}
          ]}
      ]
    }]
  },

  {
    id:"mx", label:"六、混合題", score:"8% · 每題 2%",
    instruction:"莎士比亞與珍．奧斯汀對英語詞彙的貢獻。答案：63 heart of gold　64 dressed　65 D　66 B+D（多選，錯一項扣 1 分）",
    groups:[{
      passage:"The English language has evolved alongside the creativity of its writers. Over the centuries, countless words and expressions born from literature have remained part of everyday English. Here is a look at two authors whose linguistic legacies have profoundly shaped the way we speak now.\n\n【William Shakespeare】Regarded as England's national poet, William Shakespeare was also arguably one of the greatest playwrights in history. Through timeless works like Romeo and Juliet and Hamlet, he explored universal themes of love, ambition, and human nature. Aside from his literary achievements, Shakespeare left an indelible mark on the English language. His plays breathed new life into existing expressions by giving them new figurative meanings. For instance, we now use “break the ice” to describe the act of easing tension and initiating a friendly conversation, refer to a kind-hearted person as having a “heart of gold,” or call someone deeply cherished “the apple of our eye.” Likewise, the phrase “the world is your oyster,” which suggests that one has endless opportunities ahead, continues to appear in contemporary media. Moreover, Shakespeare frequently employed conversion, changing a word's grammatical category without altering its form, to create flexible expressions. For example, he transformed nouns into verbs in innovative ways, giving rise to usages such as “to elbow” and “to grace.” These examples showcase Shakespeare's wordplay and his lasting impact on modern English.\n\n【Jane Austen】Jane Austen was one of Britain's most influential novelists, best known for works such as Pride and Prejudice and Sense and Sensibility. In her novels, she vividly portrayed the customs of British society while illuminating women's dependence on marriage in the early nineteenth century. In doing so, Austen coined numerous new words to capture her characters' emotional nuance. For example, she is often credited with the earliest use of “brace yourself,” meaning to prepare oneself for something formidable or unpleasant. Other expressions associated with her include “dirt cheap,” referring to something extremely inexpensive, and “dog-tired,” meaning completely exhausted. More intriguingly, even the culinary verb “dress,” meaning to add seasoning or sauce to a salad, is first recorded in her work. Austen also occasionally created new words simply by adding an “r” to an existing term. For instance, she formed “sympathiser” from the verb “sympathise,” creating a noun that refers to someone who expresses sympathy or support for another person.",
      zh:"英語是隨著作家的創造力一起演進的。數世紀以來，無數源自文學的字詞與表達方式一直留在日常英語之中。以下來看看兩位作家，他們在語言上的遺產深深形塑了我們現在說話的方式。\n\n【莎士比亞】被視為英格蘭的國民詩人，莎士比亞也堪稱史上最偉大的劇作家之一。透過《羅密歐與茱麗葉》和《哈姆雷特》這類不朽的作品，他探索了愛情、野心與人性這些普世的主題。除了文學成就之外，莎士比亞也在英語上留下了難以抹滅的印記。他的劇作賦予既有的表達方式新的比喻意義，讓它們重獲新生。舉例來說，我們現在用 break the ice 來形容緩和緊張氣氛、開啟友善談話的舉動，用 heart of gold 來指稱一個心地善良的人，或把深受珍愛的人稱為 the apple of our eye。同樣地，the world is your oyster 這個片語，意思是一個人前方有無盡的機會，至今仍持續出現在當代媒體中。此外，莎士比亞經常使用「詞類轉換」——在不改變字形的情況下改變一個字的語法類別——來創造靈活的表達方式。例如他以創新的方式把名詞變成動詞，產生了 to elbow（用手肘推開）與 to grace（使增光）這樣的用法。這些例子展現了莎士比亞的文字遊戲，以及他對現代英語的長遠影響。\n\n【珍．奧斯汀】珍．奧斯汀是英國最具影響力的小說家之一，以《傲慢與偏見》和《理性與感性》等作品最為知名。在她的小說中，她生動地描繪了英國社會的習俗，同時也揭示了十九世紀初女性對婚姻的依賴。在這麼做的過程中，奧斯汀創造了許多新字來捕捉她筆下人物細微的情感。例如，brace yourself 最早的用法常被歸功於她，意思是讓自己做好心理準備去面對某件艱難或不愉快的事。與她相關的其他表達還包括 dirt cheap（極其便宜）與 dog-tired（累到不行）。更有意思的是，連烹飪用的動詞 dress——意指為生菜加上調味或醬汁——也是最早記錄在她的作品中。奧斯汀偶爾也只是在既有的字後面加一個 r 就創造出新字。例如她從動詞 sympathise 造出 sympathiser，形成一個指稱對他人表達同情或支持的人的名詞。",
      questions:[
        { n:63, kind:"片語填空 (2%)", answerText:"heart of gold",
          stem:"Refer to the passage and choose from the words or expressions used by William Shakespeare or Jane Austen to complete the sentence. Make changes to the form of the word if necessary.\n\nPrometheus is remembered as a mythological figure with a(n) ______ because he endured eternal punishment from Zeus for bringing fire to humanity.",
          translation:"普羅米修斯被記為一位心地善良的神話人物，因為他為了把火帶給人類而承受了宙斯永恆的懲罰。",
          why:"空格前有不定冠詞 a(n)，所以要填名詞片語。語意線索在 because 子句：he endured eternal punishment from Zeus for bringing fire to humanity（他為了把火帶給人類而承受永恆的懲罰）——為了造福人類而自願受苦，這是極為善良的心性。文章中對應的片語是 refer to a kind-hearted person as having a “heart of gold”（用 heart of gold 指稱心地善良的人），完全吻合。\n\n為什麼不是其他莎翁片語？break the ice 指打破僵局、the apple of our eye 指深受珍愛的人（但普羅米修斯並非被宙斯珍愛，而是被懲罰）、the world is your oyster 指前途無限（與受罰的處境相反），都接不上 because 子句的理由。",
          notes:[
            {term:"a heart of gold", pos:"phr.", gloss:"心地善良、金子般的心（have a heart of gold）", ex:"He looks tough but has a heart of gold.", exZh:"他看起來兇，卻有一副善良的心。"},
            {term:"看冠詞定詞性", pos:"技巧", gloss:"空格前是 a(n)，就必須填單數名詞或名詞片語。這一步就能刪掉 break the ice 這類動詞片語。"}
          ]},

        { n:64, kind:"字形變化 (2%)", answerText:"dressed",
          stem:"The restaurant's signature salad features organic vegetables ______ with extra-virgin olive oil and a pinch of sea salt, allowing the natural flavors to stand out.",
          translation:"這家餐廳的招牌沙拉以有機蔬菜為主角，淋上特級初榨橄欖油與一小撮海鹽調味，讓天然的風味得以突顯。",
          why:"文章提到 the culinary verb “dress,” meaning to add seasoning or sauce to a salad（烹飪用動詞 dress，意為為生菜加上調味或醬汁），這正是本句的情境：with extra-virgin olive oil and a pinch of sea salt（加上橄欖油與海鹽）。\n\n字形變化是本題的重點：空格修飾的是前面的名詞 organic vegetables，而蔬菜是「被調味」的，所以要用過去分詞 dressed 作後位修飾（＝organic vegetables that are dressed with...）。若填原形 dress 會與主要動詞 features 衝突，整句出現兩個動詞。",
          notes:[
            {term:"dress", pos:"vt.", gloss:"① 為（沙拉）加調味醬（dress a salad with vinaigrette）② 穿衣 ③ 包紮傷口（dress a wound）。n. dressing 沙拉醬、敷料", ex:"Dress the salad just before serving.", exZh:"上菜前才淋上沙拉醬。"},
            {term:"過去分詞後位修飾", pos:"文法", gloss:"名詞＋p.p. ＝ 被…的（vegetables dressed with oil ＝ 淋上油的蔬菜）。等於省略了 which are。"}
          ]},

        { n:65, kind:"文本判讀 (2%)",
          stem:"The following four excerpts are taken from the works of William Shakespeare and Jane Austen. Which ONE was most likely written by Jane Austen?",
          options:{A:"“Why, then the world's mine oyster, which I with sword will open.” 那麼世界就是我的牡蠣，我要用劍把它打開。",B:"“Away, away, good William de la Pole! We grace the yeoman by conversing with him.” 走吧走吧，好威廉·德拉波爾！我們與這自由民交談已是給他增光。",C:"“And if you break the ice and do this feat, Achieve the elder, set the younger free...” 若你打破僵局、完成此舉，先攻下姊姊，便能讓妹妹自由…",D:"“The looking over his letter again, in replying to it, had such a softening tendency, that it was particularly necessary to brace her up with a few decisive expressions.” 重讀他的信並回覆它，有著如此令人心軟的傾向，因此特別需要用幾句果斷的話讓她振作起來。"}, answer:"D",
          translation:"下列四段摘錄取自莎士比亞與珍．奧斯汀的作品。哪一段最可能是珍．奧斯汀所寫？",
          explain:{
            A:"這是莎士比亞的句子。文章明確把 the world is your oyster 歸給莎翁，而 mine oyster 的古體所有格與 which I with sword will open 的倒裝語序，也都是莎劇的詩體特徵。",
            B:"這也是莎士比亞。關鍵字 grace 正是文章所舉的例子之一——he transformed nouns into verbs ... giving rise to usages such as “to elbow” and “to grace”（把名詞轉成動詞，產生 to elbow 與 to grace）；而 William de la Pole 是莎劇《亨利六世》的人物。",
            C:"同樣是莎士比亞。break the ice 在文章中被明白歸給莎翁，而且 Achieve the elder, set the younger free 的命令句詩行與無標點的韻文斷句，都是劇本台詞的形式。",
            D:"兩個線索都指向奧斯汀。第一，文中明寫她 is often credited with the earliest use of “brace yourself”（最早使用 brace yourself），而本段正是 brace her up with a few decisive expressions。第二，文體完全不同：這是結構綿長、帶有 such ... that 複句的散文敘事，討論的是書信往來與內心的軟化，正是奧斯汀小說分析人物心理的筆法，而非舞台對白。"
          },
          notes:[
            {term:"brace oneself / brace sb up", pos:"phr.", gloss:"讓自己（或某人）做好心理準備、振作起來（brace yourself for bad news）", ex:"Brace yourself: the news isn't good.", exZh:"你做好心理準備：消息不太好。"},
            {term:"用文體判斷作者", pos:"技巧", gloss:"除了找關鍵片語，也可看形式：詩行、命令句、古體字（mine／thee）屬戲劇；長句、心理描寫、間接敘述屬小說。兩條線索互相印證最保險。"}
          ]},

        { n:66, kind:"多選 (2%)",
          stem:"From (A) to (F) below, choose the ONES that are true for BOTH William Shakespeare and Jane Austen.",
          options:{A:"They are both literary giants who excelled in the same writing genre. 兩人都是在同一種寫作類型上卓越的文學巨匠。",B:"Their literary works both made an enduring contribution to English vocabulary today. 兩人的文學作品都對今日的英語詞彙做出了持久的貢獻。",C:"They both used their writing to criticize the unfair treatment of women in British society. 兩人都用寫作批評英國社會對女性的不公待遇。",D:"They both combined creative language use with insightful exploration of human experiences. 兩人都把創造性的語言運用與對人類經驗的深刻探索結合起來。",E:"Their writing was mainly characterized by humor and wordplay as the key to their popularity. 兩人的寫作主要以幽默與文字遊戲為特色，這是他們受歡迎的關鍵。",F:"Their impact on English came from inventing new words rather than reshaping existing expressions. 兩人對英語的影響來自創造新字，而非重塑既有的表達方式。"}, multi:["B","D"], answer:"B",
          translation:"從下列 (A) 到 (F) 中，選出對莎士比亞與珍．奧斯汀兩人都成立的選項。",
          explain:{
            A:"文類不同。莎士比亞是 one of the greatest playwrights（最偉大的劇作家之一），寫的是戲劇；奧斯汀是 one of Britain's most influential novelists（最具影響力的小說家之一），寫的是小說。同為文學巨匠沒錯，但 the same writing genre（同一種文類）不成立。",
            B:"兩人都成立。莎翁：left an indelible mark on the English language（在英語上留下難以抹滅的印記）；奧斯汀：coined numerous new words（創造了許多新字），而且 dirt cheap、dog-tired 等至今仍在使用。文章的開場句 countless words and expressions born from literature have remained part of everyday English 更是兩人共同的總綱。",
            C:"只有奧斯汀沾得上邊，而且說法過強。文章說她 illuminating women's dependence on marriage（揭示女性對婚姻的依賴），illuminate 是「呈現、照亮」而非 criticize（批評）；至於莎翁，文中談的是 love, ambition, and human nature（愛情、野心與人性），完全沒有提到女性處境。",
            D:"兩人都成立。語言創造方面：莎翁用 conversion（詞類轉換）創造 to elbow、to grace，奧斯汀加 r 造出 sympathiser。人類經驗方面：莎翁 explored universal themes of love, ambition, and human nature（探索愛情、野心與人性的普世主題），奧斯汀 portrayed the customs of British society 並 capture her characters' emotional nuance（捕捉人物細微的情感）。兩個條件都各自齊備。",
            E:"程度與因果都被誇大了。文章確實提到莎翁的 wordplay（文字遊戲），但從未說幽默與文字遊戲是兩人受歡迎的 the key（關鍵），奧斯汀那一段也完全沒有提到幽默。",
            F:"方向正好相反，而且兩人都不符。莎翁是 breathed new life into existing expressions by giving them new figurative meanings（賦予既有表達新的比喻意義），正是「重塑既有表達」；奧斯汀雖有造新字，但 brace yourself、dirt cheap、dog-tired 也都是用既有的字組合出新義。rather than 的排他說法使這個選項錯誤。"
          },
          notes:[
            {term:"BOTH 題的解法", pos:"技巧", gloss:"必須兩人都成立才能選。先各自檢查莎翁與奧斯汀，只要一方找不到依據就刪除。(A)(C) 就是只有一方成立的陷阱。"},
            {term:"絕對化字眼要警覺", pos:"技巧", gloss:"the same／mainly／rather than／the key 這類絕對或排他的說法，通常是出題者刻意加上的錯誤點。(A)(E)(F) 三個錯項都靠這招。"}
          ]}
      ]
    }]

            {k:"⑵", w:"comment on political issues", note:"「評論政治議題」。comment on sth 為固定搭配，介系詞 on 不可省略或換成 about 以外的字。"},
            {k:"⑶", w:"lest they (should) be criticized　或　for fear that they would / should / might be criticized", note:"「免得」。lest 後接原形動詞或 should ＋ 原形（假設語氣），而且 lest 本身已含否定，不可再加 not。for fear that 則接 would／should／might ＋ 原形。名人是被批評的對象，須用被動 be criticized。"},
            {k:"⑷", w:"or misunderstood", note:"「或誤解」。與 be criticized 由 or 並列，共用前面的 be，所以只寫過去分詞 misunderstood 即可，不必重複 be。"}
          ],
          translation:"很多名人拒絕評論政治議題，免得被批評或誤解。",
          why:"本題四個計分點各有重點。最容易失分的是第三格：lest 的字義就是「以免、免得」，已經是否定，再加 not 會變成雙重否定；而且 lest 後面要用原形動詞（假設語氣），不能寫成 lest they are criticized。第四格則考並列省略——or 之後共用前面的 be，只留過去分詞。另外要注意兩個被動：名人是「被」批評、「被」誤解，不是主動去批評別人。",
          notes:[
            {term:"lest + S + (should) V", pos:"句型", gloss:"以免、免得（lest 本身含否定，絕不可再加 not）。同義：for fear that／in case／so that ... not", ex:"He spoke quietly lest he (should) be overheard.", exZh:"他輕聲說話，以免被人聽見。"},
            {term:"decline to V", pos:"phr.", gloss:"婉拒做某事（decline to comment 拒絕評論，是新聞中的常見說法）。對照 decline ＋ N（decline an invitation）"}
          ]},

        { n:82, kind:"whoever (4%)",
          stem:"這首詩說明了選擇的限制，引起任何曾面臨艱難決定的人的共鳴。（…whoever…）",
          answers:[
            {k:"⑴", w:"This poem illustrates the limits of choice", note:"「這首詩說明了選擇的限制」。illustrate 意為「說明、闡明」，受詞是 the limits of choice。注意要用定冠詞 the（參考解答印為 that limits of choice，應為 the 之誤）。"},
            {k:"⑵", w:", striking a chord with", note:"「引起…的共鳴」。strike a chord with sb 為固定片語。此處用分詞構句承接前面的主詞 This poem，所以用現在分詞 striking，前面加逗號。"},
            {k:"⑶", w:"whoever has faced", note:"「任何曾面臨…的人」。whoever ＝ anyone who，是複合關係代名詞，引導名詞子句當 with 的受詞。視為單數，所以現在完成式用 has faced。"},
            {k:"⑷", w:"difficult decisions", note:"「艱難的決定」。泛指各種艱難決定，用複數不加冠詞。填 tough／hard decisions 亦可。"}
          ],
          translation:"這首詩說明了選擇的限制，引起任何曾面臨艱難決定的人的共鳴。",
          why:"本題的核心是題目指定的 whoever。它是複合關係代名詞，本身已包含先行詞（＝anyone who），所以前面不可再加 anyone，而且它引導的是名詞子句，在本句中當介系詞 with 的受詞。動詞一致也是重點：whoever 視為單數，所以用 has faced 而非 have faced。第二格則考分詞構句——用 striking 讓「引起共鳴」自然承接前面的主詞 This poem，不必再寫一個完整子句。",
          notes:[
            {term:"strike a chord with sb", pos:"phr.", gloss:"引起某人的共鳴、觸動心弦（chord 原指和弦）", ex:"Her speech struck a chord with young voters.", exZh:"她的演講引起了年輕選民的共鳴。"},
            {term:"whoever", pos:"複合關係代名詞", gloss:"＝anyone who，自帶先行詞，引導名詞子句，視為單數。對照 whomever（受格）與 whatever（事物）。", ex:"Whoever finishes first gets a prize.", exZh:"誰先完成就得獎。"}
          ]}
      ]
    }]
  }
  ]
};

/* ==========================================================================
   ②  以下為程式碼，一般情況不需要修改。
   ========================================================================== */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const wordOf = q => q.options ? q.options[q.answer] : (q.answerText || '');
const allQ = [];
EXAM.sections.forEach(s => s.groups.forEach(g => g.questions.forEach(q => allQ.push(q))));
const findQ = n => allQ.find(q => String(q.n) === String(n));

document.getElementById('brand').textContent = EXAM.brand;
document.getElementById('examTitle').textContent = EXAM.title;
document.getElementById('examMeta').textContent = EXAM.meta;

let noteCount = 0;
allQ.forEach(q => noteCount += (q.notes || []).length);

const nav = document.getElementById('nav');
EXAM.sections.forEach(s => {
  const a = document.createElement('a');
  a.className = 'chip'; a.href = '#sec-' + s.id; a.textContent = s.label.replace(/^[一二三四五六]、/, m => m);
  nav.appendChild(a);
});
const noteChip = document.createElement('a');
noteChip.className = 'chip'; noteChip.href = '#side'; noteChip.textContent = '重點表 ' + noteCount;
nav.appendChild(noteChip);
const toggleAll = document.createElement('button');
toggleAll.className = 'chip solid'; toggleAll.textContent = '全部展開';
nav.appendChild(toggleAll);

function renderPassage(g, i, sid) {
  let html = esc(g.passage);
  g.questions.forEach(q => {
    if (!q.evidence) return;
    const t = esc(q.evidence);
    if (html.includes(t)) html = html.replace(t, `<span class="hl ev" data-ev="${q.n}">${t}</span>`);
  });
  html = html.replace(/__(\d+)__/g, (m, n) =>
    `<button class="blank" data-blank="${n}" aria-label="第 ${n} 題空格">${n}</button>`);
  const body = '<div class="passage">' +
    html.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, ' ') + '</p>').join('') + '</div>';
  if (!g.zh) return body;
  const id = sid + '-' + i;
  return body +
    `<button class="zhbtn" data-zh="${id}">全文中譯</button>` +
    `<div class="zhbox" id="zh-${id}">` +
      g.zh.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, ' ') + '</p>').join('') +
    '</div>';
}

function renderQ(q) {
  const parts = [];
  if (q.options) {
    const ks = Object.keys(q.options);
    parts.push('<div class="opts">' + ks.map(k =>
      `<div class="opt"><span class="opt-k">(${k})</span><span>${esc(q.options[k])}</span></div>`).join('') + '</div>');
  }
  const head = `<div class="q-tag"><span class="q-n">${String(q.n).padStart(2,'0')}</span><span class="q-kind">${esc(q.kind || '')}</span></div>` +
    (q.prompt ? `<p class="prompt">${esc(q.prompt)}</p>` : '') +
    (q.stem ? `<p class="stem">${esc(q.stem).replace(/\n/g,'<br>')}</p>` : '');

  let ans = '';
  if (q.answers) {
    ans = '<ul class="fills">' + q.answers.map(a =>
      `<li class="fill"><span class="fill-k">${esc(a.k)}</span><span class="fill-w hl" data-ansmulti>${esc(a.w)}</span><span class="fill-n">${esc(a.note || '')}</span></li>`).join('') + '</ul>';
  } else {
    const label = q.options ? `(${q.answer}) ${esc(wordOf(q))}` :
      (q.answer ? `(${q.answer}) ${esc(q.answerText)}` : esc(q.answerText));
    ans = `<p class="ans"><span class="ans-k">答案</span><span class="ans-v hl" data-ans="${q.n}">${label}</span></p>`;
  }

  let expl = '';
  if (q.explain) {
    expl = '<ul class="lines">' + Object.keys(q.options).map(k => {
      const right = q.multi ? q.multi.includes(k) : k === q.answer;
      return `<li class="line ${right ? 'right' : 'wrong'}"><span class="line-k">(${k})</span><span>${esc(q.explain[k] || '')}</span></li>`;
    }).join('') + '</ul>';
  }
  const why = q.why ? `<p class="why">${esc(q.why)}</p>` : '';
  const sample = q.sample ? `<div class="sample"><p class="note-h">參考範文</p>` +
    q.sample.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g,' ')}</p>`).join('') + '</div>' : '';
  const evid = q.evidence ? `<p class="evid"><span>文中依據</span>${esc(q.evidence)}</p>` : '';
  const notes = (q.notes || []).length ? `<div class="note"><p class="note-h">重點整理</p>` +
    q.notes.map(nt => `<p class="note-i"><span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span><span class="gloss">${esc(nt.gloss || '')}</span>` +
      (nt.ex ? `<span class="ex">${esc(nt.ex)}<i>${esc(nt.exZh || '')}</i></span>` : '') + '</p>').join('') + '</div>' : '';

  return `<article class="q" id="q-${q.n}" data-n="${q.n}">
    <div class="q-top">${head}${parts.join('')}
      <button class="reveal" aria-expanded="false" aria-controls="body-${q.n}">看詳解</button>
    </div>
    <div class="body" id="body-${q.n}">
      ${ans}${q.translation ? `<p class="zh">${esc(q.translation)}</p>` : ''}${expl}${why}${evid}${sample}${notes}
    </div>
  </article>`;
}

document.getElementById('main').innerHTML = EXAM.sections.map((s, i) => `
  <section class="sec" id="sec-${s.id}">
    <div class="sec-head">
      <span class="sec-num">${String(i+1).padStart(2,'0')}</span>
      <h2 class="sec-label">${esc(s.label)}</h2>
      <span class="sec-score">${esc(s.score || '')}</span>
    </div>
    ${s.instruction ? `<p class="sec-inst">${esc(s.instruction)}</p>` : ''}
    ${s.bank ? `<div class="bank${s.bankWide ? ' wide' : ''}">${Object.keys(s.bank).map(k =>
      `<div class="bank-i" data-bank="${k}"><span>(${k})</span>${esc(s.bank[k])}</div>`).join('')}</div>` : ''}
    ${s.groups.map((g, gi) => (g.passage ? renderPassage(g, gi, s.id) : '') + g.questions.map(renderQ).join('')).join('')}
  </section>`).join('');

const items = [];
allQ.forEach(q => (q.notes || []).forEach(nt => items.push({ ...nt, n: q.n })));
document.getElementById('side').innerHTML = `
  <p class="side-h">Notes</p>
  <p class="side-t">本卷重點 ${items.length} 則</p>
  <ul class="card-list">${items.map(nt => `
    <li class="card-item"><a href="#q-${nt.n}">
      <span class="jump">第 ${nt.n} 題</span>
      <span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span>
      <div class="gloss">${esc(nt.gloss || '')}</div>
    </a></li>`).join('')}</ul>
  <p class="side-note">點任一則可跳到出處題目。用瀏覽器列印（Ctrl／⌘ + P）會自動展開全部詳解與中譯，可直接印成講義。</p>`;

document.getElementById('foot').textContent = `共 ${allQ.length} 題 · ${EXAM.footer}`;

function setOpen(card, open) {
  card.classList.toggle('open', open);
  const btn = card.querySelector('.reveal');
  btn.setAttribute('aria-expanded', open);
  btn.firstChild.nodeValue = open ? '收合詳解' : '看詳解';
  const n = card.dataset.n;
  card.querySelectorAll('.hl').forEach(h => h.classList.toggle('on', open));
  const ev = document.querySelector(`[data-ev="${n}"]`);
  if (ev) ev.classList.toggle('on', open);
  const q = findQ(n);
  if (q && q.answer && q.answerText) {
    const bi = document.querySelector(`[data-bank="${q.answer}"]`);
    if (bi) bi.classList.toggle('used', open);
  }
  const bl = document.querySelector(`[data-blank="${n}"]`);
  if (bl) {
    if (open) {
      bl.classList.add('filled');
      bl.innerHTML = `<sup>${n}</sup><span class="hl">${esc(wordOf(q))}</span>`;
      requestAnimationFrame(() => bl.querySelector('.hl').classList.add('on'));
    } else {
      bl.classList.remove('filled');
      bl.textContent = n;
    }
  }
}
document.addEventListener('click', e => {
  const rv = e.target.closest('.reveal');
  if (rv) { const c = rv.closest('.q'); setOpen(c, !c.classList.contains('open')); return; }
  const zb = e.target.closest('.zhbtn');
  if (zb) { zb.classList.toggle('on'); document.getElementById('zh-' + zb.dataset.zh).classList.toggle('on'); return; }
  const bl = e.target.closest('.blank');
  if (bl) {
    const c = document.getElementById('q-' + bl.dataset.blank);
    if (!c.classList.contains('open')) setOpen(c, true);
    c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});
toggleAll.addEventListener('click', () => {
  const open = toggleAll.textContent === '全部展開';
  document.querySelectorAll('.q').forEach(c => setOpen(c, open));
  toggleAll.textContent = open ? '全部收合' : '全部展開';
});
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.q').forEach(c => setOpen(c, true));
  document.querySelectorAll('.zhbox').forEach(b => b.classList.add('on'));
  toggleAll.textContent = '全部收合';
});
</script>
</body>
</html>
